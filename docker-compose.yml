services:
  db:
    image: postgres:16
    container_name: bug-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bug_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
    ports:
      - "5432:5432"
    volumes:
      - bug_tracker_data:/var/lib/postgresql/data

volumes:
  bug_tracker_data: